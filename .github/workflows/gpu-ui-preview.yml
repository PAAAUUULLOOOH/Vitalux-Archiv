name: Qt Quick native GPU UI prototype (no release)
on:
  push:
    branches: [experiment/qtquick-native-ui]
  pull_request:
    paths:
      - "vitalux/gpu_ui.py"
      - "assets/quick-ui/**"
      - "tests/test_gpu_ui_preview.py"
      - ".github/workflows/gpu-ui-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qml-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime for smoke test
        run: |
          python -m pip install "PySide6==6.10.1" psutil
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify Python syntax
        run: python -m compileall -q vitalux/gpu_ui.py tests/test_gpu_ui_preview.py
      - name: Load and exercise actual QML view and telemetry bridge
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: python tests/test_gpu_ui_preview.py

      - name: Assemble self-contained opt-in preview ZIP from latest tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/input build/stage artifacts
          BASE_TAG="v0.9.3.76"
          BASE_ZIP="Vitalux-${BASE_TAG}-linux-x86_64.zip"
          gh release download "$BASE_TAG" --pattern "$BASE_ZIP" --dir build/input
          unzip -tq "build/input/$BASE_ZIP"
          unzip -q "build/input/$BASE_ZIP" -d build/input
          BASE="build/input/Vitalux-${BASE_TAG}"
          test -x "$BASE/runtime/bin/python3.12"
          test -f "$BASE/vitalux/__main__.py"
          test -f "$BASE/runtime/lib/python3.12/site-packages/PySide6/QtQuick.abi3.so"
          TARGET="build/stage/Vitalux-QtQuick-GPU-Vorschau-${BASE_TAG}"
          cp -a "$BASE" "$TARGET"
          cp vitalux/gpu_ui.py "$TARGET/vitalux/gpu_ui.py"
          mkdir -p "$TARGET/assets/quick-ui"
          cp assets/quick-ui/Main.qml "$TARGET/assets/quick-ui/Main.qml"
          cp run.sh "$TARGET/run.sh"
          cp gpu-preview-starten.sh "$TARGET/GPU-Vorschau-starten.sh"
          chmod +x "$TARGET/GPU-Vorschau-starten.sh" "$TARGET/run.sh"
          (
            cd "$TARGET"
            QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software \
              LD_LIBRARY_PATH="$PWD/lib" \
              "$PWD/runtime/bin/python3.12" \
              "$GITHUB_WORKSPACE/tests/test_gpu_ui_preview.py"
          )
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("build/stage/Vitalux-QtQuick-GPU-Vorschau-v0.9.3.76")
          output = Path("artifacts/Vitalux-QtQuick-GPU-Vorschau-v0.9.3.76-linux-x86_64.zip")
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for file in sorted(root.rglob("*")):
                  if file.is_file() and "__pycache__" not in file.parts:
                      archive.write(file, root.name + "/" + file.relative_to(root).as_posix())
          print("Portable GPU preview created:", output, output.stat().st_size)
          PY
          unzip -tq artifacts/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vitalux-QtQuick-GPU-Vorschau
          path: artifacts/*.zip
          retention-days: 7
          if-no-files-found: error
