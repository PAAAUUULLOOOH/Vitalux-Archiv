name: Vitalux – Quellcode erstmals importieren

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vorhandenen Quellcode schützen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vitalux/__init__.py ]]; then
            echo "::notice::Vitalux-Quellcode ist bereits importiert. Kein Überschreiben."
            echo "ALREADY_IMPORTED=true" >> "$GITHUB_ENV"
          fi
      - name: Bestehenden offiziellen Vitalux-Release als Grundlage verwenden
        if: env.ALREADY_IMPORTED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          gh release download v0.9.3.46 \
            --pattern "Vitalux-v0.9.3.46-linux-x86_64-Portabel.zip" \
            --dir bootstrap
          unzip -tq bootstrap/Vitalux-v0.9.3.46-linux-x86_64-Portabel.zip
          unzip -q bootstrap/Vitalux-v0.9.3.46-linux-x86_64-Portabel.zip -d bootstrap
          SOURCE="bootstrap/Vitalux-v0.9.3.46"
          test -f "$SOURCE/vitalux/updater.py"
          cp -a "$SOURCE/vitalux" ./
          cp -a "$SOURCE/assets/." assets/
          mkdir -p bin
          cp "$SOURCE/bin/fio" bin/fio
          cp "$SOURCE/run.sh" ./run.sh
          cp "$SOURCE/Portable-pruefen.sh" ./Portable-pruefen.sh
          find vitalux -type d -name __pycache__ -prune -exec rm -rf {} +
          find vitalux -type f -name '*.pyc' -delete
          # Kleiner Textunterschied zwischen Archiv und lokal getesteter 0.9.3.46 korrigieren.
          sed -i 's/self.btn_install = QPushButton(tr("Update installieren"))/self.btn_install = QPushButton(tr("Jetzt aktualisieren"))/' vitalux/pages_extra.py
          # Der Änderungssatz wurde gegen das offizielle Archiv getestet.
          base64 -d packaging/v047-source.patch.gz.b64 | gzip -d > bootstrap/v047.patch
          git apply --check bootstrap/v047.patch
          git apply bootstrap/v047.patch
          grep -Fxq '__version__ = "0.9.3.47"' vitalux/__init__.py
          grep -Fq 'DEFAULT_REPO = "PAAAUUULLOOOH/Vitalux"' vitalux/updater.py
          python3 -m compileall -q vitalux
      - name: Quellcode getrennt von Binär-Laufzeit nach GitHub übernehmen
        if: env.ALREADY_IMPORTED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitalux assets run.sh Portable-pruefen.sh bin/fio
          git commit -m "Importiere Vitalux v0.9.3.47 Quellcode und GUI-Update"
          git push origin HEAD:main
      - name: Automatischen Release-Build starten
        if: env.ALREADY_IMPORTED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main
          echo "::notice::Der automatische Build ist unter Actions → Vitalux – Automatische Veröffentlichung zu finden."
