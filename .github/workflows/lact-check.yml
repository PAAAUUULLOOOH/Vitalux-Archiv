name: LACT-Integration testen

on:
  push:
    branches: [feature/lact-gpu-tuning, feature/vitalux-integrated-gpu-engine]
    paths:
      - "vitalux/lact_*.py"
      - "vitalux/pages.py"
      - "tests/test_lact_*.py"
      - "tests/test_vitalux_gpu_service.py"
      - "packaging/vitalux-gpu-service.py"
      - ".github/workflows/lact-check.yml"
  pull_request:
    paths:
      - "vitalux/lact_*.py"
      - "vitalux/pages.py"
      - "tests/test_lact_*.py"
      - "tests/test_vitalux_gpu_service.py"
      - "packaging/vitalux-gpu-service.py"
      - ".github/workflows/lact-check.yml"

permissions:
  contents: read

jobs:
  lact-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten für den nativen Qt-Test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PySide6 psutil
      - name: Bytecode und LACT-Unit-Tests
        run: |
          .venv/bin/python -m compileall -q vitalux
          .venv/bin/python tests/test_lact_client.py
          .venv/bin/python tests/test_vitalux_gpu_service.py
      - name: Native Vitalux-Oberfläche ohne Hardware prüfen
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python tests/test_lact_ui.py
      - name: Gebündelten Originaldienst vor Veröffentlichung prüfen
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/ilya-zlobintsev/LACT/releases/download/v0.10.1/lact-headless-0.10.1-0.amd64.ubuntu-2404.deb" \
            --output lact-headless.deb
          echo "c94ca31a1be6e005253a11f3bd02a48d9d08d356f08e2a5a6e9f2565283fca55  lact-headless.deb" | sha256sum --check -
          dpkg-deb -x lact-headless.deb upstream
          test -x upstream/usr/bin/lact
          upstream/usr/bin/lact --help
