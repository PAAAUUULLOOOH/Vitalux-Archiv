<svg xmlns="http://www.w3.org/2000/svg" width="600" height="375" viewBox="0 0 600 375" role="img" aria-labelledby="title desc">
  <title id="title">Vitalux</title>
  <desc id="desc">Original Vitalux-Pulse-Logo über dem originalen Vitalux-Schriftzug, wie in der Anwendung.</desc>
  <!-- Original icon artwork, centered above the original custom wordmark. -->
  <g transform="translate(185 9) scale(0.9)">
    <defs>
        <radialGradient id="base" cx="43%" cy="36%" r="70%">
          <stop offset="0%" stop-color="#1b2943"/>
          <stop offset="52%" stop-color="#101a2a"/>
          <stop offset="100%" stop-color="#080e19"/>
        </radialGradient>
        <linearGradient id="ice" x1="12%" y1="18%" x2="87%" y2="87%">
          <stop offset="0%" stop-color="#e7fcff"/>
          <stop offset="20%" stop-color="#64f4ff"/>
          <stop offset="50%" stop-color="#549eff"/>
          <stop offset="100%" stop-color="#bb85ff"/>
        </linearGradient>
        <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#90f8ff"/>
          <stop offset="47%" stop-color="#40dce9"/>
          <stop offset="75%" stop-color="#608bff"/>
          <stop offset="100%" stop-color="#be7bff"/>
        </linearGradient>
        <radialGradient id="aura" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#56eaff" stop-opacity="0.31"/>
          <stop offset="65%" stop-color="#527bff" stop-opacity="0.09"/>
          <stop offset="100%" stop-color="#527bff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- asymmetric instrument silhouette: broken enclosure rather than a boxed V -->
      <circle cx="128" cy="128" r="110" fill="url(#aura)"/>
      <circle cx="128" cy="128" r="99" fill="url(#base)" stroke="#2a415f" stroke-width="1.7"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="#263b55" stroke-width="1.4"/>
      <!-- three non-matching arcs create a recognizable silhouette -->
      <path d="M 53,52 A 107,107 0 0 1 191,42" fill="none" stroke="url(#ice)" stroke-width="11" stroke-linecap="square"/>
      <path d="M 213,76 A 107,107 0 0 1 173,224" fill="none" stroke="#a887ff" stroke-width="11" stroke-linecap="square"/>
      <path d="M 139,234 A 107,107 0 0 1 31,154" fill="none" stroke="#4cbff9" stroke-width="10" stroke-linecap="square"/>
      <path d="M 31,118 A 107,107 0 0 1 41,88" fill="none" stroke="#3e779e" stroke-width="3.5" stroke-linecap="square"/>
      <!-- asymmetrical sensor notches -->
      <path d="M 100,30 L 99,42 M 209,137 L 219,140 M 65,204 L 75,195" stroke="#96cfff" stroke-width="2.5" stroke-linecap="square" opacity=".67"/>
      <path d="M 115,55 L 140,55 M 128,43 L 128,68 M 55,129 L 70,129 M 184,129 L 199,129" fill="none" stroke="#38536f" stroke-width="1.8" opacity=".55"/>
      <path d="M 83,83 L 95,95 M 172,83 L 161,95 M 83,173 L 95,161 M 172,173 L 161,161" stroke="#45647e" stroke-width="1.6" opacity=".5"/>
      <!-- central lens and precision ring -->
      <circle cx="128" cy="128" r="62" fill="url(#aura)"/>
      <circle cx="128" cy="128" r="61" fill="none" stroke="#2c4963" stroke-width="2.5"/>
      <path d="M 95,77 A 58,58 0 0 1 169,88" fill="none" stroke="#7edbff" stroke-width="2.5" opacity=".68"/>
      <path d="M 166,168 A 58,58 0 0 1 97,178" fill="none" stroke="#876dca" stroke-width="2.5" opacity=".52"/>
      <!-- distinctive pulse: monitoring + deep V dip, not a font glyph -->
      <path d="M 65,126 H 91 L 109,101 L 132,163 L 158,94 L 173,126 H 191" fill="none" stroke="#65b3f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".11"/>
      <path d="M 65,126 H 91 L 109,101 L 132,163 L 158,94 L 173,126 H 191" fill="none" stroke="url(#wave)" stroke-width="10.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="132" cy="163" r="7.6" fill="#c9faff"/>
      <circle cx="132" cy="163" r="3.4" fill="#ffffff"/>
      <!-- sensor terminals, deliberately unbalanced -->
      <circle cx="65" cy="126" r="4.6" fill="#b0faff"/>
      <circle cx="191" cy="126" r="4.6" fill="#bc8cff"/>
      <circle cx="213" cy="76" r="4" fill="#e1bfff"/>
      <circle cx="53" cy="52" r="3.7" fill="#d7fbff"/>
  </g>
  <!-- Light GitHub background: use the matching native Vitalux wordmark. -->
  <g transform="translate(54 261) scale(0.88)">
    <defs>
        <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="15%">
          <stop offset="0%" stop-color="#17304e"/>
          <stop offset="28%" stop-color="#123454"/>
          <stop offset="63%" stop-color="#2858a7"/>
          <stop offset="100%" stop-color="#7251b8"/>
        </linearGradient>
        <linearGradient id="trim" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#64f3ff"/>
          <stop offset="75%" stop-color="#5d96ff"/>
          <stop offset="100%" stop-color="#ba8eff"/>
        </linearGradient>
      </defs>
      <!-- Hand-built angular letterforms; no font dependency. -->
      <g stroke="url(#metal)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" fill="none">
        <path d="M 29,21 L 53,87 L 78,21"/>
        <path d="M 109,21 V 87 M 100,21 H 120 M 100,87 H 120"/>
        <path d="M 149,21 H 204 M 177,21 V 87"/>
        <path d="M 226,87 L 251,21 L 277,87 M 236,62 H 267"/>
        <path d="M 309,21 V 87 H 353"/>
        <path d="M 381,21 V 68 Q 381,89 402,89 Q 426,89 426,68 V 21"/>
        <path d="M 464,21 L 512,87 M 513,21 L 465,87"/>
      </g>
      <!-- micro cuts and signature highlights -->
      <path d="M 56,79 L 65,55 M 244,47 H 256 M 488,54 L 501,35" stroke="#1a879c" stroke-width="3.5" stroke-linecap="square"/>
      <path d="M 29,10 H 56 M 308,103 H 355 M 473,103 H 515" stroke="url(#trim)" stroke-width="3.5" stroke-linecap="square"/>
      <path d="M 90,106 H 282" stroke="#6c8fbc" opacity=".5" stroke-width="2"/>
  </g>
</svg>
